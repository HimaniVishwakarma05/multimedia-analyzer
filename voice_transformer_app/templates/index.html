<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Transformer</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .container {
        width: min(900px, 92vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      h1 { margin-top: 0; }
      .controls {
        display: grid;
        gap: 14px;
        margin-top: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input, select, button {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #374151;
        background: var(--card);
        color: var(--text);
        font-size: 16px;
      }
      button {
        background: var(--accent);
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      .result {
        margin-top: 24px;
      }
      audio {
        width: 100%;
        margin-top: 12px;
      }
      .status {
        color: var(--muted);
        margin-top: 12px;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Voice Transformer</h1>
      <p>Upload a short audio clip and transform it with a different AI voice.</p>

      <form id="convertForm" enctype="multipart/form-data">
        <div class="controls">
          <div>
            <label for="audio">Audio file</label>
            <input id="audio" name="audio" type="file" accept="audio/*" required />
          </div>

          <div>
            <label for="voiceSlug">Target voice</label>
            <select id="voiceSlug" name="voiceSlug">
              <option value="warm-narrator">Warm narrator</option>
              <option value="deep-studio">Deep studio</option>
              <option value="bright-conversational">Bright conversational</option>
            </select>
          </div>

          <button type="submit">Transform voice</button>
        </div>
      </form>

      <div class="status" id="status">Ready.</div>

      <div class="result">
        <audio id="resultAudio" controls></audio>
      </div>
    </div>

    <script>
      const form = document.getElementById('convertForm');
      const status = document.getElementById('status');
      const audio = document.getElementById('resultAudio');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById('audio');
        const voiceSlug = document.getElementById('voiceSlug').value;
        const file = fileInput.files[0];

        if (!file) {
          status.textContent = 'Please choose an audio file first.';
          return;
        }

        status.textContent = 'Processing your voice sample...';

        const formData = new FormData();
        formData.append('audio', file);
        formData.append('voiceSlug', voiceSlug);

        try {
          const response = await fetch('/api/convert', {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const data = await response.json().catch(() => ({ error: 'Conversion failed.' }));
            throw new Error(data.error || 'Conversion failed.');
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          audio.src = url;
          audio.play().catch(() => {});
          status.textContent = 'Voice conversion complete.';
        } catch (error) {
          status.textContent = error.message || 'Something went wrong.';
        }
      });
    </script>
  </body>
</html>
